name: CI

# Controls when the workflow will run
on:
  # Validate every PR, including documentation-only changes.
  pull_request:
    branches: ["main", "develop", "release/**"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Keep only the latest validation for each PR. Manual runs stay independent.
concurrency:
  group: pr-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: CI
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test linting
        run: pnpm biome ci

      - name: Check dependencies
        run: pnpm knip:deps

      - name: Test Anime regressions
        run: pnpm test

      - name: Build package (to confirm building works)
        run: pnpm build
        env:
          BETTER_AUTH_SECRET: "ci-build-only-secret-not-for-production-000000000000"
          POSTGRES_URL: ""
          POSTGRES_URL_NON_POOLING: ""
